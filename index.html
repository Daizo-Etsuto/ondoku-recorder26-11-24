<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音読録音・提出アプリ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #fff;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      color: #2c3e50;
    }
    .step-box {
      background: #f9fbfb;
      border: 1px solid #e1e8ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .step-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 12px;
    }
    .timer {
      font-size: 2.2rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin: 10px 0 20px;
      color: #2c3e50;
    }
    .recording-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #e74c3c;
      border-radius: 50%;
      margin-right: 6px;
      animation: blink 1s infinite;
      visibility: hidden;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    button {
      font-size: 1rem;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin: 4px;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #startBtn {
      background-color: #e74c3c;
      color: white;
    }
    #startBtn:hover:not(:disabled) {
      background-color: #c0392b;
    }
    #stopBtn {
      background-color: #34495e;
      color: white;
    }
    #stopBtn:hover:not(:disabled) {
      background-color: #2c3e50;
    }
    #submitBtn {
      background-color: #27ae60;
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      margin-top: 16px;
    }
    #submitBtn:hover:not(:disabled) {
      background-color: #219653;
    }
    audio {
      width: 100%;
      margin: 10px 0 16px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #dce4ec;
      border-radius: 8px;
      background-color: #fff;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #3498db;
    }
    #customTaskBox {
      display: none;
      margin-top: 8px;
    }
    #postRecordSection {
      display: none;
    }
    #statusMessage {
      margin-top: 16px;
      font-weight: bold;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
    .info { color: #2980b9; }
  </style>
</head>
<body>

<div class="container">
  <h1>📖 音読録音・提出</h1>

  <!-- ステップ1：録音 -->
  <div class="step-box">
    <div class="step-title">① 音読を録音する</div>
    <div class="timer">
      <span id="recDot" class="recording-indicator"></span><span id="timerText">00:00</span>
    </div>
    <button id="startBtn">● 録音開始</button>
    <button id="stopBtn" disabled>■ 録音終了</button>
  </div>

  <!-- ステップ2：録音終了後に表示されるエリア -->
  <div id="postRecordSection" class="step-box">
    <div class="step-title">② 音声を確認して提出する</div>
    <audio id="audioPlayer" controls></audio>

    <!-- 課題・ページ選択 -->
    <div class="form-group">
      <label for="taskSelect">教科書ページ・課題番号</label>
      <select id="taskSelect">
        <option value="">-- 選択してください --</option>
      </select>
      <div id="customTaskBox">
        <input type="text" id="customTaskInput" placeholder="例：p.35 音読テスト">
      </div>
    </div>

    <!-- 生徒氏名 -->
    <div class="form-group">
      <label for="studentName">生徒氏名（フルネーム）</label>
      <input type="text" id="studentName" placeholder="例：山田 太郎">
    </div>

    <button id="submitBtn">MP3に変換して先生に提出</button>
  </div>

  <div id="statusMessage"></div>
</div>

<script>
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwNo5HiyU5G6fGxqh3XepwGYH4VMGMN8YVn4mNhoEhHs_3wM09lkpF1wWa0q6VpK81f/exec';

  const FALLBACK_TASKS = [
    { label: 'Lesson 1（p.10）', code: 'Lesson1_P10' },
    { label: 'Lesson 1（p.12）', code: 'Lesson1_P12' },
    { label: 'Lesson 2（p.20）', code: 'Lesson2_P20' },
    { label: 'Lesson 2（p.22）', code: 'Lesson2_P22' },
    { label: '課題 1', code: '課題1' },
    { label: '課題 2', code: '課題2' }
  ];

  let audioContext;
  let mediaStream;
  let scriptProcessor;
  let audioInput;
  let audioData = [];
  let sampleRate = 44100;
  let isRecording = false;
  let timerInterval;
  let seconds = 0;
  let recordedSamples = null;

  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const submitBtn = document.getElementById('submitBtn');
  const timerText = document.getElementById('timerText');
  const recDot = document.getElementById('recDot');
  const postRecordSection = document.getElementById('postRecordSection');
  const audioPlayer = document.getElementById('audioPlayer');
  const taskSelect = document.getElementById('taskSelect');
  const customTaskBox = document.getElementById('customTaskBox');
  const customTaskInput = document.getElementById('customTaskInput');
  const studentNameInput = document.getElementById('studentName');
  const statusMessage = document.getElementById('statusMessage');

  window.addEventListener('DOMContentLoaded', async () => {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_DEPLOYMENT_ID')) {
      populateTaskDropdown(FALLBACK_TASKS);
      return;
    }
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=tasks`);
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.tasks) && data.tasks.length > 0) {
        populateTaskDropdown(data.tasks);
      } else {
        populateTaskDropdown(FALLBACK_TASKS);
      }
    } catch (err) {
      populateTaskDropdown(FALLBACK_TASKS);
    }
  });

  function populateTaskDropdown(tasks) {
    taskSelect.innerHTML = '';

    const defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = '-- 選択してください --';
    taskSelect.appendChild(defaultOpt);

    tasks.forEach((task) => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify({ label: task.label, code: task.code });
      opt.textContent = task.label;
      taskSelect.appendChild(opt);
    });

    const otherOpt = document.createElement('option');
    otherOpt.value = 'OTHER';
    otherOpt.textContent = 'その他（自分で入力する）';
    taskSelect.appendChild(otherOpt);
  }

  taskSelect.addEventListener('change', () => {
    if (taskSelect.value === 'OTHER') {
      customTaskBox.style.display = 'block';
      customTaskInput.focus();
    } else {
      customTaskBox.style.display = 'none';
    }
  });

  function updateTimer() {
    seconds++;
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    timerText.textContent = `${mins}:${secs}`;
  }

  startBtn.addEventListener('click', async () => {
    statusMessage.textContent = '';
    statusMessage.className = '';
    postRecordSection.style.display = 'none';
    audioData = [];
    recordedSamples = null;

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();
      sampleRate = audioContext.sampleRate;

      audioInput = audioContext.createMediaStreamSource(mediaStream);
      scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const channelData = e.inputBuffer.getChannelData(0);
        audioData.push(new Float32Array(channelData));
      };

      audioInput.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);

      isRecording = true;
      seconds = 0;
      timerText.textContent = '00:00';
      recDot.style.visibility = 'visible';
      timerInterval = setInterval(updateTimer, 1000);

      startBtn.disabled = true;
      startBtn.textContent = '録音中...';
      stopBtn.disabled = false;
    } catch (err) {
      statusMessage.textContent = 'マイクの使用が許可されませんでした。HTTPSページか確認し、ブラウザ・OSのマイク許可を確認してください。';
      statusMessage.className = 'error';
    }
  });

  stopBtn.addEventListener('click', () => {
    isRecording = false;
    clearInterval(timerInterval);
    recDot.style.visibility = 'hidden';

    if (scriptProcessor) scriptProcessor.disconnect();
    if (audioInput) audioInput.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    if (audioContext) audioContext.close();

    startBtn.disabled = false;
    startBtn.textContent = '● やり直す（再録音）';
    stopBtn.disabled = true;

    recordedSamples = mergeBuffers(audioData);

    const mp3Blob = encodeMP3Blob(recordedSamples, sampleRate);
    if (audioPlayer.src && audioPlayer.src.startsWith('blob:')) {
      URL.revokeObjectURL(audioPlayer.src);
    }
    audioPlayer.src = URL.createObjectURL(mp3Blob);

    postRecordSection.style.display = 'block';
    taskSelect.focus();
  });

  submitBtn.addEventListener('click', () => {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_DEPLOYMENT_ID')) {
      alert('index.html の GAS_WEB_APP_URL を実際のウェブアプリURLに書き換えてください。');
      return;
    }

    const selectedVal = taskSelect.value;
    if (!selectedVal) {
      alert('教科書ページまたは課題番号を選択してください。');
      taskSelect.focus();
      return;
    }

    let taskLabel = '';
    let taskCode = '';

    if (selectedVal === 'OTHER') {
      const customVal = customTaskInput.value.trim();
      if (!customVal) {
        alert('教科書ページまたは課題名を入力してください。');
        customTaskInput.focus();
        return;
      }
      taskLabel = customVal;
      taskCode = customVal;
    } else {
      const parsed = JSON.parse(selectedVal);
      taskLabel = parsed.label;
      taskCode = parsed.code;
    }

    const name = studentNameInput.value.trim();
    if (!name) {
      alert('生徒氏名を入力してください。');
      studentNameInput.focus();
      return;
    }
    if (!recordedSamples) {
      alert('録音データがありません。');
      return;
    }

    submitBtn.disabled = true;
    startBtn.disabled = true;
    statusMessage.textContent = 'MP3に変換して送信中です。画面を閉じずにお待ちください...';
    statusMessage.className = 'info';

    setTimeout(async () => {
      try {
        const mp3Base64 = encodeMP3Base64(recordedSamples, sampleRate);

        const bodyPayload = JSON.stringify({
          base64Data: mp3Base64,
          studentName: name,
          taskLabel: taskLabel,
          taskCode: taskCode
        });

        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: bodyPayload
        });

        statusMessage.innerHTML =
          `✅ 送信が完了しました！<br>` +
          `氏名：<strong>${escapeHtml(name)}</strong> ／ 課題：<strong>${escapeHtml(taskLabel)}</strong><br>` +
          `Googleドライブとスプレッドシートへの反映をご確認ください。`;
        statusMessage.className = 'success';
        submitBtn.disabled = false;
        startBtn.disabled = false;
        postRecordSection.style.display = 'none';
      } catch (err) {
        statusMessage.textContent = '❌ 送信中にエラーが発生しました: ' + err.message;
        statusMessage.className = 'error';
        submitBtn.disabled = false;
        startBtn.disabled = false;
      }
    }, 100);
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mergeBuffers(channelBuffer) {
    let totalLength = 0;
    for (let i = 0; i < channelBuffer.length; i++) {
      totalLength += channelBuffer[i].length;
    }
    const result = new Float32Array(totalLength);
    let offset = 0;
    for (let i = 0; i < channelBuffer.length; i++) {
      result.set(channelBuffer[i], offset);
      offset += channelBuffer[i].length;
    }
    return result;
  }

  function floatTo16BitPCM(input) {
    const output = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return output;
  }

  function encodeMP3Bytes(samples, sampleRate) {
    const int16Samples = floatTo16BitPCM(samples);
    const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 64);
    const mp3Data = [];
    const sampleBlockSize = 1152;

    for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
      const sampleChunk = int16Samples.subarray(i, i + sampleBlockSize);
      const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }
    }
    const mp3buf = mp3encoder.flush();
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }

    let totalLength = 0;
    mp3Data.forEach(buf => totalLength += buf.length);
    const merged = new Uint8Array(totalLength);
    let offset = 0;
    mp3Data.forEach(buf => {
      merged.set(buf, offset);
      offset += buf.length;
    });
    return merged;
  }

  function encodeMP3Blob(samples, sampleRate) {
    const mp3Bytes = encodeMP3Bytes(samples, sampleRate);
    return new Blob([mp3Bytes], { type: 'audio/mpeg' });
  }

  function encodeMP3Base64(samples, sampleRate) {
    const merged = encodeMP3Bytes(samples, sampleRate);
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < merged.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, merged.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }
</script>

</body>
</html>
